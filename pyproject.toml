[project]
name = "lab-gate"
version = "1.0.0"
description = "Check an autonomous-lab experiment plan against written rules before it runs: PASS with a proof certificate, BLOCK with a counterexample, or ABSTAIN to a human."
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE", "NOTICE"]
authors = [{ name = "Anuja Khatri" }]
keywords = ["autonomous lab", "self-driving lab", "safety", "verification", "plan checking", "smt", "z3", "helao"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Science/Research",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Scientific/Engineering",
  "Topic :: Scientific/Engineering :: Chemistry",
]

# Runtime dependencies of the gate core only (boundary, rule registry, reference +
# SMT checkers, the CLI and Python API). helao-async is NOT a runtime dependency;
# rules about a measurement's potential read helao-async's OER dataset file, which
# `lab-gate fetch-data` downloads (see README "What it needs").
dependencies = [
  "pydantic>=2",
  "pint",
  "pyyaml",
  "numpy",
  "pyzstd",
  "z3-solver",
]

[project.optional-dependencies]
# The research/evaluation code (eval/, run from a source checkout via the Makefile
# with helao-async beside the repo) needs these on top of the core.
eval = ["pandas", "scikit-learn", "matplotlib", "python-dotenv"]
dev = ["pytest", "hypothesis", "ruff", "build", "twine"]
llm = ["anthropic", "openai"]
classifier = ["xgboost"]
# The open evaluation in inspect_eval/ (an Inspect task over the attack and benign
# plans). Run from a source checkout; the core package does not import it.
inspect = ["inspect-ai>=0.3.290"]

[project.scripts]
lab-gate = "lab_gate.cli:main"

[project.urls]
Homepage = "https://github.com/Anuja-Khatri/lab-gate"
Source = "https://github.com/Anuja-Khatri/lab-gate"
Issues = "https://github.com/Anuja-Khatri/lab-gate/issues"
Changelog = "https://github.com/Anuja-Khatri/lab-gate/blob/main/CHANGELOG.md"
Preregistration = "https://osf.io/jxhfe"
Report = "https://doi.org/10.5281/zenodo.23954617"

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = [".venv", ".sidecar", "scratch"]

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["ignore::DeprecationWarning"]

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

# The wheel ships the gate core: the public API + CLI (lab_gate), the gate
# (gate.*), and the simulator-side accounting and potential model it uses (sim_ext).
# The evaluation harness (eval/), tests and results stay in the source repository.
[tool.setuptools.packages.find]
include = ["lab_gate", "lab_gate.*", "gate", "gate.*", "sim_ext", "sim_ext.*"]

[tool.setuptools.package-data]
"gate.registry" = ["*.yaml"]
"lab_gate.examples" = ["*.json"]
"sim_ext" = ["surrogate.json"]
