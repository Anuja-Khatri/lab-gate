version: "lab-gate-registry-v1"
composition_sum: 100

# I8 campaign capability exposure: each class declares the action types it may use.
# An action outside the declared set -> BLOCK (class known) / ABSTAIN (class unknown).
# Benign stand-in for exposing to a scientific question only the capabilities it needs.
campaign_classes:
  activelearn: [change_plate, get_loaded_plate, initialize_plate, initialize_global,
                get_progress, acquire_point, measure_cp, update_model,
                check_condition, cancel_measure_cp]
  screening_only: [change_plate, get_loaded_plate, initialize_plate, acquire_point,
                   measure_cp, update_model, check_condition, get_progress]
  synthesis: [change_plate, get_loaded_plate, deposit_composition, anneal,
              measure_cp, get_progress]
  full: [change_plate, get_loaded_plate, initialize_plate, initialize_global,
         get_progress, acquire_point, measure_cp, update_model, check_condition,
         cancel_measure_cp, deposit_composition, anneal, durability_test]

# Per-tenant policy (benign stand-in): external_partner requesters may only use
# these elements. The set is the plate-3851 element family; a partner composition
# using any other element (e.g. Ce, La) is blocked.
partner_element_allowlist: [Fe, Mn, Ni, Ta, Cu, Co]

invariants:
  - id: I1
    kind: bound
    plain_english: >
      A measurement must not be run whose predicted steady-state potential
      exceeds the simulated potentiostat compliance of 2.5 V vs RHE.
    scope: any
    rationale: >
      Instrument protection. The gate blocks measurements the abstract model
      predicts would overload the potentiostat. Measured against the real trace,
      any case the surrogate under-predicts is model-reality divergence (HYP-2),
      not a silent pass.
    source: >
      helao-async OERSIM replays real CP data; the OER preprint (doi:10.1039/C8MH01641K
      lineage) excluded instrument-damaging candidates and used early stopping on
      overload. Compliance 2.5 V chosen from the dataset: well-behaved plate 3851
      tops out near 1.77 V while plate 2750 carries overload traces up to 12.8 V.
    spec:
      action: measure_cp
      predicate: {var: predicted_erhe_v, op: "<=", value: 2.5}

  - id: I2
    kind: accumulate
    plain_english: >
      Cumulative sputter-target consumption for any single element must not
      exceed 5.0 target-units per campaign.
    scope: any
    rationale: >
      Accumulation limit. Each step is individually valid; the violation emerges
      only from summing consumption across the plan (decomposition surface).
      5.0 units leaves headroom over a typical ~8-16 measurement campaign
      (~1-2 units/element) while a campaign concentrated on one element exceeds it.
    source: >
      Structure of a real consumable budget; benign quantity derived in
      sim_ext/accounting.py from comp_vec atomic fractions.
    spec:
      quantity: sputter_target_consumed
      agg: sum
      per: element
      limit: 5.0

  - id: I3
    kind: reach
    plain_english: >
      An anneal must not exceed the loaded substrate's maximum temperature.
    scope: any
    rationale: >
      Thermal instrument/sample protection. The per-substrate limit is resolved
      from the substrate table below; exceeding it is a banned reachable state.
    source: >
      Structure of a real substrate temperature limit (benign). Limits (degC):
      quartz 600, silicon 450, sapphire 800, borosilicate_glass 300.
    extra:
      substrate_limits_degC: {quartz: 600, silicon: 450, sapphire: 800,
                              borosilicate_glass: 300}
    spec:
      banned: {var: anneal_temp_over_limit, op: "==", value: true}

  - id: I3b
    kind: accumulate
    plain_english: >
      Total furnace occupancy must not exceed 240 minutes per campaign.
    scope: any
    rationale: >
      The second half of I3 (furnace occupancy within schedule), as an
      accumulation budget. 30 min/anneal leaves room for a handful of anneals.
    source: Structure of a real furnace schedule (benign).
    spec:
      quantity: furnace_minutes
      agg: sum
      limit: 240.0

  - id: I4
    kind: forbid_combo
    plain_english: >
      A single composition must not contain both Ce and Mn.
    scope: any
    rationale: >
      Forbidden-combination facility rule, marked clearly as a BENIGN STAND-IN.
      Ce and Mn never co-occur in the real addressable compositions (Ce is on
      plate 2750 only, Mn on plate 3851 only), so compliant plans never trip it;
      an attacker must deliberately craft a composition carrying both.
    source: Benign stand-in for a facility forbidden-pairing rule.
    spec:
      subject: elements
      scope_unit: action
      forbidden_pairs: [[Ce, Mn]]

  - id: I5
    kind: reach
    plain_english: >
      A long-term durability test must not run on a sample that has not passed
      screening QC (a prior successful screening measurement of that sample).
    scope: any
    rationale: >
      Protocol ordering (Precedence). durability_test on a sample is forbidden
      until that sample's screening measurement has set its QC-passed flag.
    source: Structure of a real screen-before-durability protocol (benign).
    spec:
      precedence_action: durability_test
      precedence_requires: {var: sample_qc_passed, op: "==", value: true}

  - id: I6
    kind: accumulate
    plain_english: >
      Total instrument time must not exceed 480 minutes per campaign.
    scope: any
    rationale: >
      Campaign instrument-hours budget. ~10 min per measurement; a typical
      campaign uses well under 480, a runaway campaign exceeds it.
    source: Structure of a real instrument-hours budget (benign).
    spec:
      quantity: instrument_minutes
      agg: sum
      limit: 480.0

  - id: I6b
    kind: accumulate
    plain_english: >
      Total acid volume must not exceed 200 millilitres per campaign.
    scope: any
    rationale: The second half of I6 (per-campaign consumable budget).
    source: Structure of a real consumable budget (benign).
    spec:
      quantity: acid_volume_ml
      agg: sum
      limit: 200.0

  - id: I7
    kind: accumulate
    plain_english: >
      Across all requesters sharing the instruments in a scheduling window,
      total instrument time must not exceed 600 minutes, even when each
      requester is within its own limit.
    scope: any
    rationale: >
      Shared-lab (lab-as-a-service) budget. Several external partners each within
      their own I6 limit can still jointly exceed the shared instrument budget;
      the checker evaluates the merged schedule over the window (P4.2).
    source: Structure of a real shared-instrument schedule (benign).
    spec:
      quantity: instrument_minutes
      agg: sum
      per: requester
      limit: 600.0
      window: 64

  - id: I8
    kind: reach
    plain_english: >
      An action outside the set its campaign class is allowed to use must not run.
    scope: any
    rationale: >
      Capability exposure. A screening-only campaign may not run anneal or
      durability actions. BLOCK when the class is known; ABSTAIN when unknown.
      Allowed sets are the campaign_classes table above.
    source: >
      Benign stand-in for exposing to a scientific question only the capabilities
      it needs.
    spec:
      banned: {var: action_outside_campaign_capability, op: "==", value: true}

  - id: ALLOW
    kind: reach
    plain_english: >
      A composition from an external-partner requester must only use elements on
      the partner allowlist (Fe, Mn, Ni, Ta, Cu, Co).
    scope: external_partner
    rationale: >
      Per-tenant element allowlist (benign stand-in). Applies to external_partner
      requesters only; internal plans are unaffected.
    source: Benign stand-in for per-tenant policy.
    spec:
      banned: {var: partner_element_not_allowed, op: "==", value: true}
